[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-driftguard"   # "driftguard" is taken on PyPI; the import and the command stay `driftguard`
version = "0.1.0"
description = "Detecting silent behavioral drift in deployed LLM APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Griffin Jolly" },
    { name = "Siddharth Kumar" },
    { name = "Srikumaran S" },
]
keywords = ["llm", "drift-detection", "monitoring", "change-point", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
]
# frouros (and the pinned river) cap at <3.13; 3.10-3.12 are the supported range.
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.0",
    "sqlmodel",
    "httpx",
    "python-dotenv",
    "jsonschema",
    "pyyaml",
    "frouros",
    "pandas",
    "numpy",
    "ruptures",
]

[project.optional-dependencies]
proxy = ["fastapi", "uvicorn"]
dashboard = ["streamlit>=1.45", "plotly"]
# Only needed to rebuild the frozen MMLU/XSTest sets from Hugging Face.
build-data = ["datasets"]
# Only needed to re-run the validation/ experiments from a git checkout.
validation = ["matplotlib", "tabulate", "river", "datasets"]
dev = ["pytest", "fastapi", "uvicorn", "build", "twine"]
all = ["llm-driftguard[proxy,dashboard]"]

[project.urls]
Homepage = "https://github.com/GriffinJolly/driftguard"
Issues = "https://github.com/GriffinJolly/driftguard/issues"

[project.scripts]
driftguard = "driftguard.cli:main"
# Kept for existing instructions; `driftguard eval` does the same.
driftguard-eval = "driftguard.evalsuite.runner:_main"

[tool.setuptools.packages.find]
include = ["driftguard*"]

[tool.setuptools.package-data]
driftguard = ["configs/*.json", "configs/*.yaml"]

[tool.pytest.ini_options]
# Tests live in tests/; scripts/ holds runnable tools (some call live APIs) and is never collected.
testpaths = ["tests"]
# Import the driftguard package from the repo root without installing it.
pythonpath = ["."]
