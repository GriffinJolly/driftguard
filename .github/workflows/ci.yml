name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # frouros / the pinned river cap at <3.13; 3.12 is the newest supported.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  package:
    # Builds the wheel and installs it into a clean venv, away from the source tree.
    # This is the check that catches files missing from the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[proxy]"
          cd /tmp
          /tmp/clean/bin/driftguard --version
          /tmp/clean/bin/driftguard eval --help
          /tmp/clean/bin/python -c "
          from driftguard.detection import pipeline
          from driftguard.evalsuite import tasks, refusal_probe
          for p in (pipeline.DETECTORS_YAML, pipeline.XSTEST_FROZEN, tasks.FROZEN_PATH, refusal_probe.FROZEN_PATH):
              assert p.is_file(), p
          pipeline.load_settings()
          print('packaged files found')
          "
